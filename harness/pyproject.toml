[project]
name = "rdlab"
version = "0.1.0"
description = "Relational database lab: SQL capability, optimization, connection and replication tests across many SQL engines running in Docker Compose"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "asyncpg>=0.30",
  "pymysql>=1.1",
  "cryptography>=43",
  "pymssql>=2.3",
  "oracledb>=3.0",
  "duckdb>=1.1",
  "clickhouse-connect>=0.8",
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "rich>=13",
  "httpx>=0.27",
  "tabulate>=0.9",
  "typer>=0.12",
]

[project.optional-dependencies]
exotic = [
  "ibm-db>=3.2",
  "pymonetdb>=1.8",
  "crate>=2.0",
  "vertica-python>=1.4",
  "pyexasol>=0.27",
  "firebird-driver>=1.10",
  "pyrqlite>=2.2",
  "libsql-client>=0.3",
  "jaydebeapi>=1.2",
]

[project.scripts]
rdlab = "rdlab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rdlab"]
