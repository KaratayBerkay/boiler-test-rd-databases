  labels:
    app.kubernetes.io/name: backup-h2
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: h2
    rdlab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
