# generated by k8s/gen-backup-addons.py -- scheduled backup into the stack's backup PVC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-mssql
  namespace: rdlab-mssql
  labels:
    app.kubernetes.io/name: backup-mssql
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: mssql
    rdlab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-mssql
            app.kubernetes.io/part-of: rdlab
            rdlab.io/stack: mssql
            rdlab.io/addon: backup
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: 10.10.2.51:8443/rdlab/mssql/server:2025-latest
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup mssql $TS"; /opt/mssql-tools18/bin/sqlcmd -C -S mssql1 -U sa -P 'LabPass_2026!' -b -Q "BACKUP DATABASE [lab] TO DISK = N'/backups/cron/lab-$TS.bak' WITH INIT, COMPRESSION, CHECKSUM"; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
            env:
            - name: KEEP
              value: '5'
            securityContext:
              runAsUser: 10001
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: mssql-backups
