# generated by k8s/gen-backup-addons.py -- scheduled backup into the stack's backup PVC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-pxc
  namespace: rdlab-pxc
  labels:
    app.kubernetes.io/name: backup-pxc
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: pxc
    rdlab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-pxc
            app.kubernetes.io/part-of: rdlab
            rdlab.io/stack: pxc
            rdlab.io/addon: backup
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: 10.10.2.51:8443/rdlab/percona/percona-xtradb-cluster:8.4
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup pxc $TS"; mysqldump -h pxc1 -uroot -prootpass --single-transaction --routines --triggers --events lab | gzip -c > /backups/cron/$TS.sql.gz; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
            env:
            - name: KEEP
              value: '5'
            securityContext:
              runAsUser: 1001
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: pxc-backups
