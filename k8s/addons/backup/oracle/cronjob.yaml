# generated by k8s/gen-backup-addons.py -- scheduled backup into the stack's backup PVC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-oracle
  namespace: rdlab-oracle
  labels:
    app.kubernetes.io/name: backup-oracle
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: oracle
    rdlab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-oracle
            app.kubernetes.io/part-of: rdlab
            rdlab.io/stack: oracle
