        spec:
          restartPolicy: Never
          containers:
          - name: backup
            image: 10.10.2.51:8443/rdlab/gvenzl/oracle-free:23-slim-faststart
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup oracle $TS"; printf "CREATE OR REPLACE DIRECTORY rdlab_bk AS '/backups/cron';\nGRANT READ, WRITE ON DIRECTORY rdlab_bk TO system;\nEXIT\n" | sqlplus -s system/rootpass@oracle/FREEPDB1 && expdp system/rootpass@oracle/FREEPDB1 SCHEMAS=lab DIRECTORY=rdlab_bk DUMPFILE=lab-$TS.dmp LOGFILE=exp-$TS.log; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
            env:
            - name: KEEP
              value: '5'
            securityContext:
              runAsUser: 54321
            volumeMounts:
            - name: backups
