  labels:
    app.kubernetes.io/name: backup-mariadb
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: mariadb
    rdlab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
