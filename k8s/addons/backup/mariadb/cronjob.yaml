            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup mariadb $TS"; mariadb-dump -h primary -uroot -prootpass --single-transaction --routines --triggers --events --gtid lab | gzip -c > /backups/cron/$TS.sql.gz; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
