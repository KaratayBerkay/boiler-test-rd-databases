# IBM Db2 Community Edition (free: 4 cores / 16 GB / 100 GB). Requires a privileged container.
#
# Backup strategy (`rdlab run db2 --phases backup`): offline full image, then LOGARCHMETH1 DISK + TRACKMOD ON for online
#   full + incremental images (INCLUDE LOGS) restored INTO new databases with ROLLFORWARD, PITR to a timestamp from the
#   archived logs — all in the shared `db2-backups` volume (/backups, archive under /backups/logs).
# Logging strategy: db2diag.log (DIAGLEVEL), package-cache statement metrics, an activity event monitor written to tables,
#   db2audit policy (EXECUTE/OBJMAINT) archived + extracted to /backups/audit; Docker json-file rotation.
name: rdlab-db2
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "3", compress: "true", tag: "{{.Name}}" }
services:
  volumes-init:
    image: icr.io/db2_community/db2:latest
    container_name: rdlab-db2-volumes-init
    user: root
    entrypoint: ["sh", "-c", "chmod 1777 /backups && echo volumes ready"]
    volumes: [db2-backups:/backups]
    logging: *logging
    restart: "no"
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: rdlab-db2
    privileged: true
    logging: *logging
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: labpass
      DBNAME: lab
      DB2INSTANCE: db2inst1
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
      SAMPLEDB: "false"
    volumes: [db2:/database, db2-backups:/backups]
    ports: ["50000:50000"]
    depends_on:
      volumes-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c \"db2 connect to lab >/dev/null 2>&1 && db2 'select 1 from sysibm.sysdummy1' >/dev/null 2>&1\""]
      interval: 15s
      timeout: 20s
      retries: 60
      start_period: 120s
volumes:
  db2:
  db2-backups:
