# generated by k8s/gen.py from stacks/citus/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init-01-replication-hba-sh
  namespace: rdlab-citus
  annotations:
    rdlab.io/source: init/01-replication-hba.sh
data:
  01-replication-hba.sh: '#!/usr/bin/env bash

    # allow streaming replication connections from the replica containers (trust auth, lab only)

    set -e

    echo "host replication all all trust" >> "$PGDATA/pg_hba.conf"

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements" || true

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init-02-logging-sh
  namespace: rdlab-citus
  annotations:
    rdlab.io/source: init/02-logging.sh
data:
  02-logging.sh: '#!/usr/bin/env bash

    # Logging strategy, appended to postgresql.conf at initdb time (NOT passed as `postgres -c ...`: command-line options

    # outrank ALTER SYSTEM / postgresql.auto.conf, so they could never be changed at runtime without a restart).

    # The replica clones the primary with pg_basebackup and therefore inherits this block. (Citus: coordinator + workers)

    set -e

    cat >> "$PGDATA/postgresql.conf" <<''CONF''


    # ---- rdlab logging strategy ---------------------------------------------------------------------

    logging_collector = on                      # PG writes its own files (docker logs keeps only the collector''s startup lines)

    log_destination = ''stderr,jsonlog''          # text log for humans + JSON lines for log shippers (Vector/Fluent Bit/Loki)

    log_directory = ''/var/lib/postgresql/log''   # outside PGDATA so base backups do not carry the logs

    log_filename = ''postgresql-%Y-%m-%d.log''    # jsonlog uses the same name with .json

    log_rotation_age = 1d

    log_rotation_size = 100MB

    log_truncate_on_rotation = on

    log_min_duration_statement = 100ms          # slow-query log; ALTER SYSTEM SET ... = 0 logs everything (overhead measured by the lab)

    log_lock_waits = on                         # deadlock_timeout (1 s) waits are logged

    log_temp_files = 0                          # every temp file with its size (work_mem too small?)

    log_checkpoints = on

    log_autovacuum_min_duration = 1s

    log_connections = all                       # PG18: receipt, authentication, authorization, setup_durations

    log_disconnections = on

    log_line_prefix = ''%m [%p] %q%u@%d app=%a ''

    log_error_verbosity = default

    auto_explain.log_min_duration = 500ms       # shared_preload_libraries=pg_stat_statements,auto_explain is on the command line

    auto_explain.log_format = json

    auto_explain.log_nested_statements = on

    CONF

    echo "logging strategy appended to $PGDATA/postgresql.conf"

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-haproxy-haproxy-cfg
  namespace: rdlab-citus
  annotations:
    rdlab.io/source: haproxy/haproxy.cfg
data:
  haproxy.cfg: "global\n    maxconn 8000\ndefaults\n    mode tcp\n    timeout connect 5s\n    timeout client 600s\n    timeout server 600s\nlisten stats\n    mode http\n    bind *:8404\n    stats enable\n\
    \    stats uri /\n    stats refresh 5s\n# application entry point: round-robin over three PgBouncer instances that all pool into the coordinator\nlisten pgbouncers\n    bind *:5432\n    balance roundrobin\n\
    \    option pgsql-check user lab\n    server pgbouncer1 pgbouncer1:5432 check\n    server pgbouncer2 pgbouncer2:5432 check\n    server pgbouncer3 pgbouncer3:5432 check\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-setup-setup-sh
  namespace: rdlab-citus
  annotations:
    rdlab.io/source: setup/setup.sh
data:
  setup.sh: "#!/usr/bin/env bash\n# Register 5 worker primaries and their streaming replicas (as Citus secondary nodes) with the coordinator.\nset -euo pipefail\nQ() { psql -v ON_ERROR_STOP=1 -h coordinator\
    \ -U lab -d lab -tAc \"$1\"; }\nfor i in $(seq 1 60); do Q \"SELECT 1\" >/dev/null 2>&1 && break; sleep 2; done\nQ \"SELECT citus_set_coordinator_host('coordinator', 5432);\"\nfor i in 1 2 3 4 5; do\n\
    \  Q \"SELECT citus_add_node('w$i', 5432);\" || Q \"SELECT nodeid FROM pg_dist_node WHERE nodename = 'w$i'\"\ndone\nfor i in 1 2 3 4 5; do\n  Q \"SELECT citus_add_secondary_node('r$i', 5432, 'w$i',\
    \ 5432);\" || true\ndone\nQ \"SELECT citus_version();\"\npsql -h coordinator -U lab -d lab -c \"SELECT nodeid, nodename, nodeport, noderole, isactive, shouldhaveshards FROM pg_dist_node ORDER BY nodeid;\"\
    \n"
