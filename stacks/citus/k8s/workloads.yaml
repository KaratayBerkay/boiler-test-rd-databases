apiVersion: apps/v1
kind: Deployment
metadata:
  name: w1
  namespace: rdlab-citus
  labels:
    app.kubernetes.io/name: w1
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: citus
    rdlab.io/container: rdlab-citus-w1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: w1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: w1
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: citus
        rdlab.io/container: rdlab-citus-w1
    spec:
      containers:
      - name: w1
        image: 10.10.2.51:8443/rdlab/citusdata/citus:latest
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - shared_preload_libraries=citus,pg_stat_statements,auto_explain
        - -c
        - max_connections=300
        - -c
        - shared_buffers=384MB
        - -c
        - work_mem=16MB
        - -c
        - maintenance_work_mem=128MB
        - -c
        - effective_cache_size=1GB
        - -c
        - wal_level=replica
        - -c
        - max_wal_senders=5
        - -c
        - max_replication_slots=5
        - -c
        - hot_standby=on
        - -c
        - citus.enable_repartition_joins=on
        - -c
        - citus.max_adaptive_executor_pool_size=4
        - -c
        - citus.max_cached_conns_per_worker=1
        - -c
        - random_page_cost=1.1
        - -c
        - jit=off
        - -c
        - max_wal_size=1GB
        - -c
        - synchronous_commit=on
        - -c
        - archive_mode=on
        - -c
        - archive_command=test ! -f /backups/wal/w1/%f && cp %p /backups/wal/w1/%f
        - -c
        - archive_timeout=60
        env:
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: POSTGRES_DB
          value: lab
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: POSTGRES_PASSWORD
          value: labpass
        - name: POSTGRES_USER
          value: lab
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: cm-init-01-replication-hba-sh
          mountPath: /docker-entrypoint-initdb.d/zz-replication-hba.sh
          subPath: 01-replication-hba.sh
          readOnly: true
        - name: cm-init-02-logging-sh
          mountPath: /docker-entrypoint-initdb.d/zz-logging.sh
          subPath: 02-logging.sh
          readOnly: true
        - name: citus-w1
          mountPath: /var/lib/postgresql
        - name: citus-backups
          mountPath: /backups
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 120
        resources:
          limits:
            cpu: 800m
            memory: 1536Mi
      terminationGracePeriodSeconds: 30
      hostname: w1
      initContainers:
      - name: init-backup-init
        image: 10.10.2.51:8443/rdlab/citusdata/citus:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - mkdir -p /backups/wal/coordinator /backups/wal/w1 /backups/wal/w2 /backups/wal/w3 /backups/wal/w4 /backups/wal/w5 && chmod -R 1777 /backups && echo backups ready
        volumeMounts:
        - name: citus-backups
          mountPath: /backups
        securityContext:
          runAsUser: 0
      volumes:
      - name: cm-init-01-replication-hba-sh
        configMap:
          name: cm-init-01-replication-hba-sh
          defaultMode: 493
      - name: cm-init-02-logging-sh
        configMap:
          name: cm-init-02-logging-sh
          defaultMode: 493
      - name: citus-w1
        persistentVolumeClaim:
          claimName: citus-w1
      - name: citus-backups
        persistentVolumeClaim:
          claimName: citus-backups
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
