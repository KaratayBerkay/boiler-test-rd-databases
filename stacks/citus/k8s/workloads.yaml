          \ lab -D \"$PGDATA\" -Fp -Xs -R -C -S \"$SLOT\" -v; do\n    echo \"waiting for $UPSTREAM...\"; rm -rf \"$PGDATA\"/*; sleep 2; done\nfi\nexec gosu postgres postgres -c shared_preload_libraries=citus,pg_stat_statements,auto_explain\
          \ -c hot_standby=on -c hot_standby_feedback=on -c max_connections=300 \\\n     -c shared_buffers=384MB -c work_mem=16MB -c random_page_cost=1.1 -c jit=off\n"
