# Citus (PostgreSQL 18 + Citus) sharded cluster:
#   application -> HAProxy -> 3 x PgBouncer (transaction pooling) -> coordinator -> 5 worker primaries (w1..w5), each with a
#   streaming replica (r1..r5) registered as a Citus secondary node. Every PostgreSQL instance is capped at 0.8 CPU / 1.5 GiB.
#
# Backup strategy (`rdlab run citus --phases backup`, harness/rdlab/backup/citus.py):
#   - every primary (coordinator + w1..w5) archives WAL into its own directory on the shared `citus-backups` volume
#     (archive_mode=on, archive_command -> /backups/wal/<node>/%f, archive_timeout=60)
#   - pg_basebackup per node into /backups/<node>, one cluster-consistent named restore point (citus_create_restore_point:
#     2PC is blocked while the point is written on every node), then every node is restored to that point in a
#     throw-away container on an isolated docker network that reuses the node names, so the restored coordinator's
#     pg_dist_node metadata points at the restored workers without editing it
#   - pg_dump through the coordinator for the logical strategy (restored tables are plain, re-distribute afterwards)
# Logging strategy: init/02-logging.sh (same block as stacks/postgres: logging_collector + jsonlog, slow statements >= 100 ms,
#   lock waits, temp files, checkpoints, connections, auto_explain JSON plans); every container's stdout goes to the
#   Docker json-file driver with rotation (x-logging).
name: rdlab-citus
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "3", compress: "true", tag: "{{.Name}}" }
x-pg: &pg
  image: citusdata/citus:latest
  logging: *logging
  environment: &pgenv
    POSTGRES_USER: lab
    POSTGRES_PASSWORD: labpass
    POSTGRES_DB: lab
    POSTGRES_HOST_AUTH_METHOD: trust      # lab only: lets coordinator<->worker and replication connections skip passwords
    PGDATA: /var/lib/postgresql/18/docker
  deploy:
    resources:
      limits:
        cpus: "0.8"
        memory: 1536M
  shm_size: 256m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
    interval: 3s
    timeout: 3s
    retries: 40
x-replica-cmd: &replica-cmd
  command:
    - bash
    - -ec
    - |
      mkdir -p "$$PGDATA" && chown postgres:postgres "$$PGDATA" && chmod 700 "$$PGDATA"
      if [ ! -s "$$PGDATA/PG_VERSION" ]; then
        until gosu postgres pg_basebackup -h "$$UPSTREAM" -p 5432 -U lab -D "$$PGDATA" -Fp -Xs -R -C -S "$$SLOT" -v; do
          echo "waiting for $$UPSTREAM..."; rm -rf "$$PGDATA"/*; sleep 2; done
      fi
      exec gosu postgres postgres -c shared_preload_libraries=citus,pg_stat_statements,auto_explain -c hot_standby=on -c hot_standby_feedback=on -c max_connections=300 \
           -c shared_buffers=384MB -c work_mem=16MB -c random_page_cost=1.1 -c jit=off

services:
  backup-init:
    # one-shot: per-node WAL archive directories on the shared backup volume, writable by the postgres user of every container
    image: citusdata/citus:latest
    container_name: rdlab-citus-backup-init
    entrypoint: ["sh", "-c", "mkdir -p /backups/wal/coordinator /backups/wal/w1 /backups/wal/w2 /backups/wal/w3 /backups/wal/w4 /backups/wal/w5 && chmod -R 1777 /backups && echo backups ready"]
    volumes: [citus-backups:/backups]
    logging: *logging
    restart: "no"
  coordinator:
    <<: *pg
    container_name: rdlab-citus-coordinator
    hostname: coordinator
    command:
      - postgres
      - -c
      - shared_preload_libraries=citus,pg_stat_statements,auto_explain
      - -c
      - max_connections=300
      - -c
      - shared_buffers=384MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - hot_standby=on
      - -c
      - citus.enable_repartition_joins=on
      - -c
      - citus.max_adaptive_executor_pool_size=4
      - -c
      - citus.max_cached_conns_per_worker=1
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - max_wal_size=1GB
      - -c
      - synchronous_commit=on
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /backups/wal/coordinator/%f && cp %p /backups/wal/coordinator/%f
      - -c
      - archive_timeout=60
    volumes:
      - ./init/01-replication-hba.sh:/docker-entrypoint-initdb.d/zz-replication-hba.sh:ro
      - ./init/02-logging.sh:/docker-entrypoint-initdb.d/zz-logging.sh:ro
      - citus-coordinator:/var/lib/postgresql
      - citus-backups:/backups
    depends_on:
      backup-init: { condition: service_completed_successfully }
    ports: ["15531:5432"]
  w1:
