# generated by k8s/gen.py from stacks/cockroach/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-conf-log-yaml
  namespace: rdlab-cockroach
  annotations:
    rdlab.io/source: conf/log.yaml
data:
  log.yaml: "# CockroachDB logging strategy: every channel goes to a JSON file group under <store>/logs (rotated), the operational\n# channels also to stderr so `docker logs` shows node health. SQL_PERF\
    \ = slow query log (sql.log.slow_query.latency_threshold),\n# SENSITIVE_ACCESS = admin/table audit, SQL_EXEC = statement log when sql.log.all_statements.enabled is on.\nfile-defaults:\n  dir: /cockroach/cockroach-data/logs\n\
    \  format: json\n  max-file-size: 100MiB\n  max-group-size: 300MiB\n  buffered-writes: true\nsinks:\n  file-groups:\n    default:\n      channels: [DEV, OPS, HEALTH, STORAGE, SESSIONS, SQL_SCHEMA, USER_ADMIN,\
    \ PRIVILEGES, TELEMETRY, KV_DISTRIBUTION]\n    sql-audit:\n      channels: [SENSITIVE_ACCESS]\n      auditable: true\n    sql-perf:\n      channels: [SQL_PERF, SQL_INTERNAL_PERF]\n    sql-exec:\n  \
    \    channels: [SQL_EXEC]\n  stderr:\n    channels: [OPS, HEALTH]\n    format: json\n    redact: false\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-haproxy-haproxy-cfg
  namespace: rdlab-cockroach
  annotations:
    rdlab.io/source: haproxy/haproxy.cfg
data:
  haproxy.cfg: "global\n    maxconn 4096\ndefaults\n    mode tcp\n    timeout connect 10s\n    timeout client 10m\n    timeout server 10m\n    option clitcpka\nlisten psql\n    bind :26257\n    mode tcp\n\
    \    balance roundrobin\n    option httpchk GET /health?ready=1\n    server crdb1 crdb1:26257 check port 8080\n    server crdb2 crdb2:26257 check port 8080\n    server crdb3 crdb3:26257 check port 8080\n"
