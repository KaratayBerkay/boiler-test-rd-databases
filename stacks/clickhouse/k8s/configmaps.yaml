apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-config-keeper-xml
  namespace: rdlab-clickhouse
  annotations:
    rdlab.io/source: config/keeper.xml
data:
  keeper.xml: "<clickhouse>\n    <logger><level>information</level><console>true</console></logger>\n    <listen_host>0.0.0.0</listen_host>\n    <keeper_server>\n        <tcp_port>9181</tcp_port>\n    \
    \    <server_id>1</server_id>\n        <log_storage_path>/var/lib/clickhouse-keeper/coordination/log</log_storage_path>\n        <snapshot_storage_path>/var/lib/clickhouse-keeper/coordination/snapshots</snapshot_storage_path>\n\
    \        <coordination_settings>\n            <operation_timeout_ms>10000</operation_timeout_ms>\n            <session_timeout_ms>30000</session_timeout_ms>\n            <raft_logs_level>warning</raft_logs_level>\n\
    \        </coordination_settings>\n        <raft_configuration>\n            <server><id>1</id><hostname>keeper</hostname><port>9234</port></server>\n        </raft_configuration>\n    </keeper_server>\n\
    </clickhouse>\n"
