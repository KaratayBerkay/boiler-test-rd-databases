# generated by k8s/gen.py from stacks/clickhouse/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-config-cluster-xml
  namespace: rdlab-clickhouse
  annotations:
    rdlab.io/source: config/cluster.xml
data:
  cluster.xml: "<clickhouse>\n    <listen_host>0.0.0.0</listen_host>\n    <remote_servers>\n        <lab_cluster>\n            <shard>\n                <internal_replication>true</internal_replication>\n\
    \                <replica><host>ch1</host><port>9000</port><user>lab</user><password>labpass</password></replica>\n                <replica><host>ch2</host><port>9000</port><user>lab</user><password>labpass</password></replica>\n\
    \            </shard>\n        </lab_cluster>\n    </remote_servers>\n    <zookeeper>\n        <node><host>keeper</host><port>9181</port></node>\n    </zookeeper>\n    <distributed_ddl><path>/clickhouse/task_queue/ddl</path></distributed_ddl>\n\
    \    <max_connections>4096</max_connections>\n    <max_concurrent_queries>500</max_concurrent_queries>\n</clickhouse>\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-config-macros-ch1-xml
  namespace: rdlab-clickhouse
  annotations:
    rdlab.io/source: config/macros-ch1.xml
data:
  macros-ch1.xml: "<clickhouse>\n    <macros>\n        <cluster>lab_cluster</cluster>\n        <shard>01</shard>\n        <replica>ch1</replica>\n    </macros>\n</clickhouse>\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-config-backups-xml
  namespace: rdlab-clickhouse
  annotations:
    rdlab.io/source: config/backups.xml
data:
  backups.xml: "<!-- Backup strategy: a local \"backups\" disk on the shared /backups volume, allowed for BACKUP ... TO Disk('backups', ...) -->\n<clickhouse>\n    <storage_configuration>\n        <disks>\n\
    \            <backups>\n                <type>local</type>\n                <path>/backups/</path>\n            </backups>\n        </disks>\n    </storage_configuration>\n    <backups>\n        <allowed_disk>backups</allowed_disk>\n\
    \        <allowed_path>/backups/</allowed_path>\n    </backups>\n</clickhouse>\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-config-logging-xml
  namespace: rdlab-clickhouse
  annotations:
    rdlab.io/source: config/logging.xml
data:
  logging.xml: "<!-- Logging strategy: JSON server log (file with rotation + console for `docker logs`), query_log flushed every second,\n     session_log for logins, text_log for server messages as a table.\
    \ -->\n<clickhouse>\n    <logger>\n        <level>information</level>\n        <log>/var/log/clickhouse-server/clickhouse-server.log</log>\n        <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>\n\
    \        <size>100M</size>\n        <count>3</count>\n        <console>1</console>\n        <formatting>\n            <type>json</type>\n        </formatting>\n    </logger>\n    <query_log>\n     \
    \   <database>system</database>\n        <table>query_log</table>\n        <ttl>event_date + INTERVAL 7 DAY</ttl>\n        <flush_interval_milliseconds>1000</flush_interval_milliseconds>\n    </query_log>\n\
    \    <session_log>\n        <database>system</database>\n        <table>session_log</table>\n        <ttl>event_date + INTERVAL 7 DAY</ttl>\n        <flush_interval_milliseconds>1000</flush_interval_milliseconds>\n\
    \    </session_log>\n    <text_log>\n        <database>system</database>\n        <table>text_log</table>\n        <level>information</level>\n        <ttl>event_date + INTERVAL 3 DAY</ttl>\n      \
    \  <flush_interval_milliseconds>2000</flush_interval_milliseconds>\n    </text_log>\n    <part_log>\n        <database>system</database>\n        <table>part_log</table>\n        <ttl>event_date + INTERVAL\
    \ 3 DAY</ttl>\n    </part_log>\n</clickhouse>\n"
---
