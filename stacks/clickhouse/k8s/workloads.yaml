apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: rdlab-clickhouse
  labels:
    app.kubernetes.io/name: keeper
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: clickhouse
    rdlab.io/container: rdlab-ch-keeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keeper
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: clickhouse
        rdlab.io/container: rdlab-ch-keeper
    spec:
      containers:
      - name: keeper
        image: 10.10.2.51:8443/rdlab/clickhouse/clickhouse-keeper:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: cm-config-keeper-xml
          mountPath: /etc/clickhouse-keeper/keeper_config.xml
          subPath: keeper.xml
          readOnly: true
        - name: ch-keeper
          mountPath: /var/lib/clickhouse-keeper
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - echo ruok | timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9181; cat >&3; head -c4 <&3' | grep -q imok
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - echo ruok | timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/9181; cat >&3; head -c4 <&3' | grep -q imok
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      hostname: keeper
      volumes:
      - name: cm-config-keeper-xml
        configMap:
          name: cm-config-keeper-xml
          defaultMode: 493
      - name: ch-keeper
        persistentVolumeClaim:
          claimName: ch-keeper
