# generated by k8s/gen.py from stacks/clickhouse/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch1
  namespace: rdlab-clickhouse
  labels:
    app.kubernetes.io/name: ch1
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: clickhouse
    rdlab.io/container: rdlab-ch-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ch1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ch1
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: clickhouse
        rdlab.io/container: rdlab-ch-1
    spec:
      containers:
      - name: ch1
        image: 10.10.2.51:8443/rdlab/clickhouse/clickhouse-server:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CLICKHOUSE_DB
          value: lab
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: '1'
        - name: CLICKHOUSE_PASSWORD
          value: labpass
        - name: CLICKHOUSE_USER
          value: lab
        ports:
        - containerPort: 8123
        - containerPort: 9000
        volumeMounts:
        - name: cm-config-cluster-xml
          mountPath: /etc/clickhouse-server/config.d/cluster.xml
          subPath: cluster.xml
          readOnly: true
        - name: cm-config-macros-ch1-xml
          mountPath: /etc/clickhouse-server/config.d/macros.xml
          subPath: macros-ch1.xml
          readOnly: true
        - name: cm-config-backups-xml
          mountPath: /etc/clickhouse-server/config.d/backups.xml
          subPath: backups.xml
          readOnly: true
        - name: cm-config-logging-xml
          mountPath: /etc/clickhouse-server/config.d/logging.xml
          subPath: logging.xml
          readOnly: true
        - name: ch1
          mountPath: /var/lib/clickhouse
        - name: ch1-logs
          mountPath: /var/log/clickhouse-server
        - name: ch-backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - wget -qO- http://127.0.0.1:8123/ping | grep -q Ok
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - wget -qO- http://127.0.0.1:8123/ping | grep -q Ok
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      hostname: ch1
      initContainers:
      - name: wait-keeper
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 keeper 9181; do echo waiting for keeper:9181; sleep 2; done
      - name: init-volumes-init
        image: 10.10.2.51:8443/rdlab/clickhouse/clickhouse-server:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - chmod 1777 /backups && echo volumes ready
        volumeMounts:
        - name: ch-backups
          mountPath: /backups
        securityContext:
          runAsUser: 0
      volumes:
      - name: cm-config-cluster-xml
        configMap:
          name: cm-config-cluster-xml
          defaultMode: 493
      - name: cm-config-macros-ch1-xml
        configMap:
          name: cm-config-macros-ch1-xml
          defaultMode: 493
      - name: cm-config-backups-xml
        configMap:
          name: cm-config-backups-xml
          defaultMode: 493
      - name: cm-config-logging-xml
        configMap:
          name: cm-config-logging-xml
          defaultMode: 493
      - name: ch1
        persistentVolumeClaim:
          claimName: ch1
      - name: ch1-logs
        persistentVolumeClaim:
          claimName: ch1-logs
      - name: ch-backups
        persistentVolumeClaim:
          claimName: ch-backups
---
