apiVersion: apps/v1
kind: Deployment
metadata:
  name: maxscale
  namespace: rdlab-mariadb
  labels:
    app.kubernetes.io/name: maxscale
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: mariadb
    rdlab.io/container: rdlab-mdb-maxscale
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maxscale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maxscale
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: mariadb
        rdlab.io/container: rdlab-mdb-maxscale
    spec:
      containers:
      - name: maxscale
        image: 10.10.2.51:8443/rdlab/mariadb/maxscale:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4006
        - containerPort: 8989
        volumeMounts:
        - name: cm-maxscale-maxscale-cnf
          mountPath: /etc/maxscale.cnf.d/lab.cnf
          subPath: maxscale.cnf
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - maxctrl list servers | grep -q Master
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - maxctrl list servers | grep -q Master
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-primary
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 primary 3306; do echo waiting for primary:3306; sleep 2; done
      - name: wait-replica
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 replica 3306; do echo waiting for replica:3306; sleep 2; done
      volumes:
      - name: cm-maxscale-maxscale-cnf
        configMap:
          name: cm-maxscale-maxscale-cnf
          defaultMode: 493
