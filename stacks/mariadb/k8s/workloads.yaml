    app.kubernetes.io/name: primary
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: mariadb
    rdlab.io/container: rdlab-mdb-primary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: primary
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: mariadb
        rdlab.io/container: rdlab-mdb-primary
    spec:
      containers:
      - name: primary
        image: 10.10.2.51:8443/rdlab/mariadb:11
        imagePullPolicy: IfNotPresent
        args:
        - --server-id=1
        - --log-bin=binlog
        - --binlog-format=ROW
        - --gtid-strict-mode=ON
        - --gtid-domain-id=1
        - --max-connections=1000
        - --innodb-buffer-pool-size=2G
        - --innodb-log-file-size=1G
        - --innodb-flush-log-at-trx-commit=1
        - --performance-schema=ON
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --slow-query-log=ON
        - --long-query-time=0.1
        - --log-slow-verbosity=query_plan,explain
        - --slow-query-log-file=/var/log/mysql/slow.log
        - --log-error=/var/log/mysql/error.log
        - --log-warnings=3
        - --innodb-print-all-deadlocks=ON
        - --plugin-load-add=server_audit
        - --server-audit-logging=ON
        - --server-audit-events=CONNECT,QUERY_DDL
        - --server-audit-output-type=file
        - --server-audit-file-path=/var/log/mysql/audit.log
        - --server-audit-file-rotate-size=100000000
        - --server-audit-file-rotations=3
        env:
        - name: MARIADB_DATABASE
          value: lab
        - name: MARIADB_PASSWORD
          value: labpass
        - name: MARIADB_REPLICATION_PASSWORD
          value: replpass
        - name: MARIADB_REPLICATION_USER
          value: repl
        - name: MARIADB_ROOT_PASSWORD
          value: rootpass
        - name: MARIADB_USER
          value: lab
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: cm-init-primary
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: mdb-primary
          mountPath: /var/lib/mysql
        - name: mdb-backups
          mountPath: /backups
        - name: mdb-logs
          mountPath: /var/log/mysql
        readinessProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - healthcheck.sh
            - --connect
            - --innodb_initialized
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: init-volumes-init
        image: 10.10.2.51:8443/rdlab/mariadb:11
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - mkdir -p /backups /var/log/mysql && chmod 1777 /backups /var/log/mysql && echo volumes ready
        volumeMounts:
        - name: mdb-backups
          mountPath: /backups
        - name: mdb-logs
          mountPath: /var/log/mysql
        securityContext:
          runAsUser: 0
      volumes:
      - name: cm-init-primary
        configMap:
          name: cm-init-primary
          defaultMode: 493
      - name: mdb-primary
        persistentVolumeClaim:
          claimName: mdb-primary
      - name: mdb-backups
        persistentVolumeClaim:
          claimName: mdb-backups
      - name: mdb-logs
        persistentVolumeClaim:
          claimName: mdb-logs
