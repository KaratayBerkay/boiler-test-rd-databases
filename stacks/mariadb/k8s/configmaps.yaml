# generated by k8s/gen.py from stacks/mariadb/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-maxscale-maxscale-cnf
  namespace: rdlab-mariadb
  annotations:
    rdlab.io/source: maxscale/maxscale.cnf
data:
  maxscale.cnf: '[primary]

    type=server

    address=primary

    port=3306


    [replica]

    type=server

    address=replica

    port=3306


    [MariaDB-Monitor]

    type=monitor

    module=mariadbmon

    servers=primary,replica

    user=maxscale

    password=maxscalepass

    monitor_interval=1000ms

    failcount=3

    auto_failover=true

    auto_rejoin=true

    replication_user=repl

    replication_password=replpass

    enforce_read_only_slaves=true


    [RW-Split-Router]

    type=service

    router=readwritesplit

    servers=primary,replica

    user=maxscale

    password=maxscalepass

    master_reconnection=true

    transaction_replay=true

    delayed_retry=true


    [RW-Split-Listener]

    type=listener

    service=RW-Split-Router

    port=4006

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init-primary
  namespace: rdlab-mariadb
  annotations:
    rdlab.io/source: init-primary
data:
  01-users.sql: '-- runs on the primary at first start; binlogged, therefore replicated to the replica as well

    GRANT REPLICATION CLIENT, REPLICATION SLAVE, PROCESS, SELECT ON *.* TO ''lab''@''%'';

    CREATE USER IF NOT EXISTS ''maxscale''@''%'' IDENTIFIED BY ''maxscalepass'';

    GRANT ALL PRIVILEGES ON *.* TO ''maxscale''@''%'' WITH GRANT OPTION;

    FLUSH PRIVILEGES;

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init-replica
  namespace: rdlab-mariadb
  annotations:
    rdlab.io/source: init-replica
data:
  01-start-replica.sql: '-- the entrypoint already ran CHANGE MASTER TO (from MARIADB_MASTER_HOST); pin GTID mode and start

    CHANGE MASTER TO MASTER_USE_GTID = slave_pos;

    START REPLICA;

    '
