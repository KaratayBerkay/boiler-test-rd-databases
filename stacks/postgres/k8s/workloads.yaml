apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary
  namespace: rdlab-postgres
  labels:
    app.kubernetes.io/name: primary
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: postgres
    rdlab.io/container: rdlab-pg-primary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: primary
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: postgres
        rdlab.io/container: rdlab-pg-primary
    spec:
      containers:
      - name: primary
        image: 10.10.2.51:8443/rdlab/pgvector/pgvector:pg18
        imagePullPolicy: IfNotPresent
        args:
        - postgres
        - -c
        - wal_level=replica
        - -c
        - max_wal_senders=10
        - -c
        - max_replication_slots=10
        - -c
        - hot_standby=on
        - -c
        - synchronous_commit=on
        - -c
        - shared_buffers=2GB
        - -c
        - work_mem=64MB
        - -c
        - maintenance_work_mem=512MB
        - -c
        - effective_cache_size=8GB
        - -c
        - max_connections=300
        - -c
        - track_io_timing=on
        - -c
        - max_wal_size=4GB
        - -c
        - random_page_cost=1.1
        - -c
        - jit=off
        - -c
        - archive_mode=on
        - -c
        - archive_command=test ! -f /backups/wal/%f && cp %p /backups/wal/%f
        - -c
        - archive_timeout=60
        - -c
        - summarize_wal=on
        - -c
        - wal_summary_keep_time=1d
        - -c
        - shared_preload_libraries=pg_stat_statements,auto_explain
        - -c
        - pg_stat_statements.track=all
        env:
        - name: POSTGRES_DB
          value: lab
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        - name: POSTGRES_PASSWORD
          value: labpass
        - name: POSTGRES_USER
          value: lab
        - name: REPL_PASSWORD
          value: replpass
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: cm-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: pg-primary
          mountPath: /var/lib/postgresql
        - name: pg-backups
          mountPath: /backups
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: init-backup-init
        image: 10.10.2.51:8443/rdlab/pgvector/pgvector:pg18
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - mkdir -p /backups/wal && chmod 1777 /backups /backups/wal && echo backups ready
        volumeMounts:
        - name: pg-backups
          mountPath: /backups
        securityContext:
          runAsUser: 0
      volumes:
      - name: cm-init
        configMap:
          name: cm-init
          defaultMode: 493
      - name: pg-primary
        persistentVolumeClaim:
          claimName: pg-primary
      - name: pg-backups
        persistentVolumeClaim:
          claimName: pg-backups
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1024Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replica
  namespace: rdlab-postgres
  labels:
    app.kubernetes.io/name: replica
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: postgres
    rdlab.io/container: rdlab-pg-replica
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: replica
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: postgres
        rdlab.io/container: rdlab-pg-replica
    spec:
      containers:
      - name: replica
        image: 10.10.2.51:8443/rdlab/pgvector/pgvector:pg18
        imagePullPolicy: IfNotPresent
        args:
        - bash
        - -ec
        - "mkdir -p \"$PGDATA\" && chown postgres:postgres \"$PGDATA\" && chmod 700 \"$PGDATA\"\nif [ ! -s \"$PGDATA/PG_VERSION\" ]; then\n  until gosu postgres pg_basebackup -h primary -p 5432 -U replicator\
          \ -D \"$PGDATA\" -Fp -Xs -R -C -S replica1 -v; do\n    echo \"waiting for primary...\"; rm -rf \"$PGDATA\"/*; sleep 2; done\nfi\nexec gosu postgres postgres -c hot_standby=on -c hot_standby_feedback=on\
          \ -c shared_buffers=2GB -c work_mem=64MB \\\n     -c max_connections=300 -c shared_preload_libraries=pg_stat_statements,auto_explain -c track_io_timing=on -c random_page_cost=1.1 -c jit=off\n\
          # (logging settings come with postgresql.conf cloned from the primary: init/02-logging.sh)\n"
        env:
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: PGPASSWORD
          value: replpass
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pg-replica
          mountPath: /var/lib/postgresql
        - name: pg-backups
          mountPath: /backups
        - name: dshm
          mountPath: /dev/shm
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab && psql -U lab -d lab -tAc 'select pg_is_in_recovery()' | grep -q t
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U lab -d lab && psql -U lab -d lab -tAc 'select pg_is_in_recovery()' | grep -q t
          periodSeconds: 3
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-primary
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 primary 5432; do echo waiting for primary:5432; sleep 2; done
      volumes:
      - name: pg-replica
        persistentVolumeClaim:
          claimName: pg-replica
      - name: pg-backups
        persistentVolumeClaim:
          claimName: pg-backups
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1024Mi
