apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: rdlab-postgres
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: postgres
    rdlab.io/container: rdlab-pg-haproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: postgres
        rdlab.io/container: rdlab-pg-haproxy
    spec:
      containers:
      - name: haproxy
        image: 10.10.2.51:8443/rdlab/haproxy:lts
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        - containerPort: 5001
        - containerPort: 8404
        volumeMounts:
        - name: cm-haproxy-haproxy-cfg
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-primary
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 primary 5432; do echo waiting for primary:5432; sleep 2; done
      - name: wait-replica
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 replica 5432; do echo waiting for replica:5432; sleep 2; done
      volumes:
      - name: cm-haproxy-haproxy-cfg
        configMap:
          name: cm-haproxy-haproxy-cfg
          defaultMode: 493
---
