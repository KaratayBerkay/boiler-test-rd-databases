# generated by k8s/gen.py from stacks/postgres/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-haproxy-haproxy-cfg
  namespace: rdlab-postgres
  annotations:
    rdlab.io/source: haproxy/haproxy.cfg
data:
  haproxy.cfg: "global\n    maxconn 4000\ndefaults\n    mode tcp\n    timeout connect 5s\n    timeout client 600s\n    timeout server 600s\n    option tcplog\nlisten stats\n    mode http\n    bind *:8404\n\
    \    stats enable\n    stats uri /\n    stats refresh 5s\n# write endpoint: always the primary\nlisten pg_write\n    bind *:5000\n    option pgsql-check user lab\n    server primary primary:5432 check\n\
    # read endpoint: round-robin across primary and replica (application decides what is read-only)\nlisten pg_read\n    bind *:5001\n    balance roundrobin\n    option pgsql-check user lab\n    server\
    \ primary primary:5432 check\n    server replica replica:5432 check\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init
  namespace: rdlab-postgres
  annotations:
    rdlab.io/source: init
data:
  01-replication.sh: '#!/usr/bin/env bash

    set -e

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<SQL

    CREATE ROLE replicator WITH REPLICATION LOGIN PASSWORD ''${REPL_PASSWORD}'';

    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE EXTENSION IF NOT EXISTS pg_prewarm;

    SQL

    echo "host replication replicator all scram-sha-256" >> "$PGDATA/pg_hba.conf"

    '
  02-logging.sh: '#!/usr/bin/env bash

    # Logging strategy, appended to postgresql.conf at initdb time (NOT passed as `postgres -c ...`: command-line options

    # outrank ALTER SYSTEM / postgresql.auto.conf, so they could never be changed at runtime without a restart).

    # The replica clones the primary with pg_basebackup and therefore inherits this block.

    set -e

    cat >> "$PGDATA/postgresql.conf" <<''CONF''


    # ---- rdlab logging strategy ---------------------------------------------------------------------

    logging_collector = on                      # PG writes its own files (docker logs keeps only the collector''s startup lines)

    log_destination = ''stderr,jsonlog''          # text log for humans + JSON lines for log shippers (Vector/Fluent Bit/Loki)

    log_directory = ''/var/lib/postgresql/log''   # outside PGDATA so base backups do not carry the logs

    log_filename = ''postgresql-%Y-%m-%d.log''    # jsonlog uses the same name with .json

    log_rotation_age = 1d

    log_rotation_size = 100MB

    log_truncate_on_rotation = on

    log_min_duration_statement = 100ms          # slow-query log; ALTER SYSTEM SET ... = 0 logs everything (overhead measured by the lab)

    log_lock_waits = on                         # deadlock_timeout (1 s) waits are logged

    log_temp_files = 0                          # every temp file with its size (work_mem too small?)

    log_checkpoints = on

    log_autovacuum_min_duration = 1s

    log_connections = all                       # PG18: receipt, authentication, authorization, setup_durations

    log_disconnections = on

    log_line_prefix = ''%m [%p] %q%u@%d app=%a ''

    log_error_verbosity = default

    auto_explain.log_min_duration = 500ms       # shared_preload_libraries=pg_stat_statements,auto_explain is on the command line

    auto_explain.log_format = json

    auto_explain.log_nested_statements = on

    CONF

    echo "logging strategy appended to $PGDATA/postgresql.conf"

    '
