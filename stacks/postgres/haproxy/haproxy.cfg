global
    maxconn 4000
defaults
    mode tcp
    timeout connect 5s
    timeout client 600s
    timeout server 600s
    option tcplog
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
# write endpoint: always the primary
listen pg_write
    bind *:5000
    option pgsql-check user lab
    server primary primary:5432 check
# read endpoint: round-robin across primary and replica (application decides what is read-only)
listen pg_read
    bind *:5001
    balance roundrobin
    option pgsql-check user lab
    server primary primary:5432 check
    server replica replica:5432 check
