# System audit trace (firebird.conf AuditTraceConfigFile): statements slower than 100 ms and every connection of lab.fdb
# are written to /var/log/firebird/audit.log by the server. On-demand "log everything" = a user trace session
# (fbtracemgr -start -config <conf with time_threshold = 0>), see harness/rdlab/dblogs/firebird.py.
database = /var/lib/firebird/data/lab.fdb
{
    enabled = true
    log_filename = /var/log/firebird/audit.log
    max_log_size = 100
    log_connections = true
    log_statement_prepare = true     # every statement (audit trail, not subject to time_threshold)
    log_statement_finish = true      # with timing + plan, only when slower than time_threshold
    log_errors = true
    time_threshold = 100
    max_sql_length = 2000
    print_plan = true
}
