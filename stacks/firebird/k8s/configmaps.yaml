# generated by k8s/gen.py from stacks/firebird/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-conf-fbtrace-conf
  namespace: rdlab-firebird
  annotations:
    rdlab.io/source: conf/fbtrace.conf
data:
  fbtrace.conf: "# System audit trace (firebird.conf AuditTraceConfigFile): statements slower than 100 ms and every connection of lab.fdb\n# are written to /var/log/firebird/audit.log by the server. On-demand\
    \ \"log everything\" = a user trace session\n# (fbtracemgr -start -config <conf with time_threshold = 0>), see harness/rdlab/dblogs/firebird.py.\ndatabase = /var/lib/firebird/data/lab.fdb\n{\n    enabled\
    \ = true\n    log_filename = /var/log/firebird/audit.log\n    max_log_size = 100\n    log_connections = true\n    log_statement_prepare = true     # every statement (audit trail, not subject to time_threshold)\n\
    \    log_statement_finish = true      # with timing + plan, only when slower than time_threshold\n    log_errors = true\n    time_threshold = 100\n    max_sql_length = 2000\n    print_plan = true\n\
    }\n"
