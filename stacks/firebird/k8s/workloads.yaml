          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: init-volumes-init
        image: 10.10.2.51:8443/rdlab/firebirdsql/firebird:5
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - chmod 1777 /backups /var/log/firebird && echo volumes ready
        volumeMounts:
        - name: firebird-backups
          mountPath: /backups
        - name: firebird-logs
          mountPath: /var/log/firebird
        securityContext:
          runAsUser: 0
      volumes:
      - name: firebird
        persistentVolumeClaim:
          claimName: firebird
      - name: firebird-backups
        persistentVolumeClaim:
          claimName: firebird-backups
      - name: firebird-logs
