        ports:
        - containerPort: 3050
        volumeMounts:
        - name: firebird
          mountPath: /var/lib/firebird/data
        - name: firebird-backups
          mountPath: /backups
        - name: firebird-logs
          mountPath: /var/log/firebird
        - name: cm-conf-fbtrace-conf
          mountPath: /etc/firebird/fbtrace.conf
          subPath: fbtrace.conf
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - echo 'select 1 from rdb$database;' | isql -u lab -p labpass localhost:/var/lib/firebird/data/lab.fdb >/dev/null 2>&1
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
