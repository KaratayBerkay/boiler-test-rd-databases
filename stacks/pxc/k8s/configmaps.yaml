# generated by k8s/gen.py from stacks/pxc/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-haproxy-cfg
  namespace: rdlab-pxc
  annotations:
    rdlab.io/source: haproxy.cfg
data:
  haproxy.cfg: "global\n    maxconn 4096\ndefaults\n    mode tcp\n    timeout connect 10s\n    timeout client 10m\n    timeout server 10m\nlisten galera\n    bind :3306\n    mode tcp\n    balance roundrobin\n\
    \    option tcp-check\n    server pxc1 pxc1:3306 check\n    server pxc2 pxc2:3306 check\n    server pxc3 pxc3:3306 check\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-conf-lab-cnf
  namespace: rdlab-pxc
  annotations:
    rdlab.io/source: conf/lab.cnf
data:
  lab.cnf: '[mysqld]

    pxc_encrypt_cluster_traffic=OFF

    pxc_strict_mode=PERMISSIVE

    wsrep_slave_threads=8

    wsrep_provider_options="gcache.size=512M;gcs.fc_limit=256"

    innodb_buffer_pool_size=2G

    max_connections=1000

    local_infile=ON

    performance_schema=ON

    character_set_server=utf8mb4


    # ---- logging strategy (each node writes its own files, named by hostname) ----

    log_error=/var/log/mysql/error.log

    log_error_verbosity=3

    log_timestamps=SYSTEM

    slow_query_log=ON

    long_query_time=0.1

    log_slow_extra=ON

    log_slow_verbosity=full

    log_slow_rate_limit=1

    slow_query_log_file=/var/log/mysql/slow.log

    general_log=OFF

    general_log_file=/var/log/mysql/general.log

    innodb_print_all_deadlocks=ON

    # audit_log plugin (Percona): JSON records, DDL / account commands only ("loose-": the variables are unknown while --initialize runs without plugins)

    plugin-load-add=audit_log=audit_log.so

    loose-audit_log_format=JSON

    loose-audit_log_file=/var/log/mysql/audit.json

    loose-audit_log_policy=QUERIES

    loose-audit_log_include_commands=create_table,drop_table,alter_table,create_db,drop_db,truncate,grant,revoke,create_user,drop_user,alter_user

    loose-audit_log_rotate_on_size=100M

    loose-audit_log_rotations=3

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init
  namespace: rdlab-pxc
  annotations:
    rdlab.io/source: init
data:
  01-users.sql: 'CREATE DATABASE IF NOT EXISTS lab;

    CREATE USER IF NOT EXISTS ''lab''@''%'' IDENTIFIED BY ''labpass'';

    GRANT ALL PRIVILEGES ON lab.* TO ''lab''@''%'';

    GRANT REPLICATION CLIENT, PROCESS, SELECT ON *.* TO ''lab''@''%'';

    FLUSH PRIVILEGES;

    '
