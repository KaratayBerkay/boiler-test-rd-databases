apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: rdlab-pxc
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: pxc
    rdlab.io/container: rdlab-pxc-haproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: pxc
        rdlab.io/container: rdlab-pxc-haproxy
    spec:
      containers:
      - name: haproxy
        image: 10.10.2.51:8443/rdlab/haproxy:lts
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: cm-haproxy-cfg
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 120
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-pxc3
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 pxc3 3306; do echo waiting for pxc3:3306; sleep 2; done
      volumes:
      - name: cm-haproxy-cfg
        configMap:
          name: cm-haproxy-cfg
          defaultMode: 493
