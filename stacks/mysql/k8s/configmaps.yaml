# generated by k8s/gen.py from stacks/mysql/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init
  namespace: rdlab-mysql
  annotations:
    rdlab.io/source: init
data:
  setup.sh: "#!/usr/bin/env bash\n# One-shot: create lab users/db on the source (replicated to the replica via GTID), then point the replica at the source.\nset -euo pipefail\nS=\"mysql -h source -uroot\
    \ -prootpass\"\nR=\"mysql -h replica -uroot -prootpass\"\nfor i in $(seq 1 60); do $S -e 'SELECT 1' >/dev/null 2>&1 && $R -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done\n$S <<'SQL'\nCREATE DATABASE\
    \ IF NOT EXISTS lab;\nCREATE USER IF NOT EXISTS 'lab'@'%' IDENTIFIED BY 'labpass';\nGRANT ALL PRIVILEGES ON lab.* TO 'lab'@'%';\nGRANT REPLICATION CLIENT, REPLICATION SLAVE, PROCESS, SELECT ON *.* TO\
    \ 'lab'@'%';\nCREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY 'replpass';\nGRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';\nCREATE USER IF NOT EXISTS 'monitor'@'%' IDENTIFIED BY 'monitorpass';\nGRANT\
    \ REPLICATION CLIENT, PROCESS, SELECT ON *.* TO 'monitor'@'%';\nFLUSH PRIVILEGES;\nSQL\n# logging strategy: structured JSON error log next to the text one (component is persisted in mysql.component,\n\
    # the setting in mysqld-auto.cnf) -> /var/log/mysql/error.log.00.json\n$S -e \"INSTALL COMPONENT 'file://component_log_sink_json'\" 2>/dev/null || true\n$S -e \"SET PERSIST log_error_services = 'log_filter_internal;\
    \ log_sink_internal; log_sink_json'\"\n$R <<'SQL'\nSTOP REPLICA;\nCHANGE REPLICATION SOURCE TO SOURCE_HOST='source', SOURCE_PORT=3306, SOURCE_USER='repl', SOURCE_PASSWORD='replpass',\n  SOURCE_AUTO_POSITION=1,\
    \ GET_SOURCE_PUBLIC_KEY=1, SOURCE_CONNECT_RETRY=5;\nSTART REPLICA;\nSET PERSIST read_only = ON;\nSET PERSIST super_read_only = ON;\nSQL\n# wait until the replica has applied the user creation\nfor i\
    \ in $(seq 1 60); do\n  if $R -E -e \"SHOW REPLICA STATUS\" | grep -qE \"Replica_SQL_Running: Yes\" && mysql -h replica -ulab -plabpass -e 'SELECT 1' >/dev/null 2>&1; then\n    echo \"replica replicating\
    \ and lab user visible\"; $R -E -e \"SHOW REPLICA STATUS\" | grep -E \"Running|Seconds_Behind|Executed_Gtid|Last_.*Error\"; exit 0\n  fi\n  sleep 2\ndone\necho \"replica did not come up\"; $R -E -e\
    \ \"SHOW REPLICA STATUS\"; exit 1\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-proxysql-proxysql-cnf
  namespace: rdlab-mysql
  annotations:
    rdlab.io/source: proxysql/proxysql.cnf
data:
  proxysql.cnf: "datadir=\"/var/lib/proxysql\"\nadmin_variables=\n{\n    admin_credentials=\"admin:admin\"\n    mysql_ifaces=\"0.0.0.0:6032\"\n}\nmysql_variables=\n{\n    threads=4\n    max_connections=4096\n\
    \    default_query_delay=0\n    default_query_timeout=3600000\n    have_compress=true\n    poll_timeout=2000\n    interfaces=\"0.0.0.0:6033\"\n    default_schema=\"lab\"\n    stacksize=1048576\n   \
    \ server_version=\"9.0.0\"\n    connect_timeout_server=3000\n    monitor_username=\"monitor\"\n    monitor_password=\"monitorpass\"\n    monitor_history=600000\n    monitor_connect_interval=10000\n\
    \    monitor_ping_interval=5000\n    monitor_read_only_interval=1500\n    monitor_read_only_timeout=500\n    ping_interval_server_msec=10000\n    ping_timeout_server=500\n    commands_stats=true\n \
    \   sessions_sort=true\n    connect_retries_on_failure=3\n    default_authentication_plugin=\"caching_sha2_password\"\n    have_ssl=true\n}\n# hostgroup 10 = writer (source), 20 = readers (source +\
    \ replica)\nmysql_servers=\n(\n    { address=\"source\",  port=3306, hostgroup=10, max_connections=500, weight=1000 },\n    { address=\"source\",  port=3306, hostgroup=20, max_connections=500, weight=1\
    \ },\n    { address=\"replica\", port=3306, hostgroup=20, max_connections=500, weight=1000 }\n)\nmysql_replication_hostgroups=\n(\n    { writer_hostgroup=10, reader_hostgroup=20, check_type=\"read_only\"\
    , comment=\"lab\" }\n)\nmysql_users=\n(\n    { username=\"lab\", password=\"labpass\", default_hostgroup=10, default_schema=\"lab\", transaction_persistent=1, active=1, max_connections=4000 }\n)\nmysql_query_rules=\n\
    (\n    { rule_id=1, active=1, match_digest=\"^SELECT .* FOR UPDATE\", destination_hostgroup=10, apply=1 },\n    { rule_id=2, active=1, match_digest=\"^SELECT\", destination_hostgroup=20, apply=1 }\n\
    )\n"
