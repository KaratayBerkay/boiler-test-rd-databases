# generated by k8s/gen.py from stacks/yugabyte/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: batch/v1
kind: Job
metadata:
  name: init
  namespace: rdlab-yugabyte
  labels:
    app.kubernetes.io/name: init
    app.kubernetes.io/part-of: rdlab
    rdlab.io/stack: yugabyte
    rdlab.io/container: rdlab-yb-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: yugabyte
        rdlab.io/container: rdlab-yb-init
    spec:
      containers:
      - name: init
        image: 10.10.2.51:8443/rdlab/yugabytedb/yugabyte:latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -ec
        args:
        - 'for i in $(seq 1 60); do bin/ysqlsh -h yb1 -U yugabyte -c ''SELECT 1'' >/dev/null 2>&1 && break; sleep 3; done

          bin/ysqlsh -h yb1 -U yugabyte -c "CREATE DATABASE lab" || true

          bin/ysqlsh -h yb1 -U yugabyte -d lab -c "CREATE EXTENSION IF NOT EXISTS vector" || true

          for i in $(seq 1 60); do n=$(bin/yb-admin -master_addresses yb1:7100,yb2:7100,yb3:7100 list_all_tablet_servers 2>/dev/null | grep -c ALIVE || true); [ "$n" -ge 3 ] && break; sleep 3; done

          bin/yb-admin -master_addresses yb1:7100,yb2:7100,yb3:7100 list_all_tablet_servers | head -5

          bin/ysqlsh -h yb1 -U yugabyte -c "SELECT * FROM yb_servers()"

          '
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-yb3
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 yb3 5433; do echo waiting for yb3:5433; sleep 2; done
      restartPolicy: OnFailure
---
