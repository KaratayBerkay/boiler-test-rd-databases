# generated by k8s/gen.py from stacks/tidb/compose.yaml -- edit the compose file, then `make k8s-gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-conf-tidb-toml
  namespace: rdlab-tidb
  annotations:
    rdlab.io/source: conf/tidb.toml
data:
  tidb.toml: '# TiDB server config (logging strategy). The main log stays on stdout (Docker json-file, JSON format) so

    # `docker logs` and log shippers keep working; the slow log goes to a file because INFORMATION_SCHEMA.SLOW_QUERY

    # and CLUSTER_SLOW_QUERY are views over that file.

    [log]

    level = "info"

    format = "json"

    slow-threshold = 100                 # ms; runtime: SET GLOBAL tidb_slow_log_threshold

    expensive-threshold = 10000

    slow-query-file = "/var/log/tidb/tidb-slow.log"


    [log.file]

    max-size = 100                       # MB, applies to the slow log too

    max-days = 3

    max-backups = 3

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-conf-tikv-toml
  namespace: rdlab-tidb
  annotations:
    rdlab.io/source: conf/tikv.toml
data:
  tikv.toml: '# lab settings: keep TiKV from pre-allocating/reserving tens of GB per node and from refusing writes on a nearly full host disk

    [storage]

    reserve-space = "1GB"

    reserve-raft-space = "256MB"


    [raftstore]

    capacity = "20GB"


    [rocksdb]

    max-open-files = 4096


    [raftdb]

    max-open-files = 4096

    '
