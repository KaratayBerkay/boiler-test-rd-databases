spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init
        app.kubernetes.io/part-of: rdlab
        rdlab.io/stack: mssql
        rdlab.io/container: rdlab-mssql-init
    spec:
      containers:
      - name: init
        image: 10.10.2.51:8443/rdlab/mssql/server:2025-latest
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - /init/setup.sh
        volumeMounts:
        - name: cm-init
          mountPath: /init
          readOnly: true
        - name: mssql-shared
          mountPath: /var/opt/mssql/shared
        securityContext:
          runAsUser: 0
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: wait-mssql1
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 mssql1 1433; do echo waiting for mssql1:1433; sleep 2; done
      - name: wait-mssql2
        image: 10.10.2.51:8443/rdlab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 mssql2 1433; do echo waiting for mssql2:1433; sleep 2; done
      volumes:
      - name: cm-init
        configMap:
          name: cm-init
          defaultMode: 493
      - name: mssql-shared
        persistentVolumeClaim:
          claimName: mssql-shared
      restartPolicy: OnFailure
